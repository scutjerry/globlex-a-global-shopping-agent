# Globex MVP：单一浏览器入口为 frontend（Nginx + React 静态资源）。
# 所有商品与订单均为项目自建的虚构演示数据；订单中心支持受控模拟创建/取消，
# 但不接入真实支付、履约、物流或库存预占，价格仅为静态规则的模拟估算。
# 用法：
#   1) 把 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL 等写进项目根目录的 .env（参考 .env.example）
#   2) docker compose -f docker/docker-compose.yaml up -d --build
#   3) 浏览器访问 http://localhost:8080
# .env 是 app/worker 的唯一权威来源：它通过 env_file 注入，宿主机同名环境变量无法覆盖。
# 若 .env 不存在，容器仍会启动，但 LLM 调用会在应用启动/请求时报出明确错误。
# 项目名固定为 globex，因此容器为 globex-app-1 / globex-worker-1 / globex-redis-1 /
# globex-qdrant-1 / globex-frontend-1，命名卷为 globex_*。
name: globex
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "8000"
    # .env is authoritative for every variable it defines. Compose interpolation gives the
    # host shell precedence over --env-file, so a stray machine-level LLM_MODEL silently won
    # over the project .env; env_file is read from the file only and cannot be overridden by
    # the shell. Keys defined in .env must therefore NOT also appear under `environment:`,
    # because `environment:` would win again.
    env_file:
      - path: ../.env
        required: false
    environment:
      # Only wiring/tuning defaults that .env does not define.
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_MIN_INTERVAL_SECONDS: ${LLM_MIN_INTERVAL_SECONDS:-1.0}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-globex_products}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/globex.db}
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-1}
      QUEUE_WAIT_SECONDS: ${QUEUE_WAIT_SECONDS:-300}
      DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - app-data:/app/data
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    # Same rule as `app`: .env supplies every value it defines; see the note there.
    env_file:
      - path: ../.env
        required: false
    environment:
      # The worker must always consume the queue, so this stays forced here even when
      # .env disables the queue for the app (synchronous mode).
      QUEUE_ENABLED: "1"
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_MIN_INTERVAL_SECONDS: ${LLM_MIN_INTERVAL_SECONDS:-1.0}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-globex_products}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/globex.db}
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    # Keep this compatible with the existing qdrant-data volume. Upgrade with an explicit data migration.
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
  qdrant-data:
  redis-data:
